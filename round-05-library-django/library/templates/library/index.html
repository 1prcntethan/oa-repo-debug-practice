<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Library</title>
  </head>
  <body>
    <h1>Library</h1>
    <ul>
      {% for book in books %}
        <li>{{ book.title }} by {{ book.author }} ({{ book.copies_available }} available)</li>
      {% empty %}
        <li>No books yet.</li>
      {% endfor %}
    </ul>
  </body>
</html>
